services:
  postgres:
    image: postgres:16-alpine
    container_name: contextlens-postgres
    environment:
      POSTGRES_USER: contextlens
      POSTGRES_PASSWORD: contextlens
      POSTGRES_DB: contextlens
    ports:
      - "5432:5432"
    volumes:
      - contextlens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextlens -d contextlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contextlens-postgres-data:
